<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Niña y el Lienzo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f1ec;
    --ink:#1c1a17;
    --gold:#b8935f;
    --muted:#8a8378;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Jost',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:32px 16px 60px;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
    text-align:center;
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-size:clamp(28px,5vw,42px);
    text-align:center;
    margin-bottom:6px;
    letter-spacing:.01em;
  }
  .sub{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:16px;
    color:var(--muted);
    text-align:center;
    margin-bottom:34px;
    max-width:480px;
  }

  .frame-wrap{
    position:relative;
    width:100%;
    max-width:420px;
    aspect-ratio: 720 / 1280;
    border-radius:4px;
    overflow:hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.04);
  }

  .base-photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    z-index:1;
  }

  /* The black canvas region in the source photo, measured as a
     percentage of the 720x1280 frame so it stays aligned at any size */
  .canvas-slot{
    position:absolute;
    top:23.3%;
    left:18.2%;
    width:63.2%;
    height:38.8%;
    z-index:2;
    overflow:hidden;
    background:#0a0908;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.4);
  }

  .canvas-slot img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 1.1s ease;
    filter:saturate(1.03) contrast(1.02);
  }
  .canvas-slot img.active{ opacity:1; }

  .canvas-slot .credit{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    z-index:3;
    padding:7px 10px 6px;
    background:linear-gradient(to top, rgba(0,0,0,.65), rgba(0,0,0,0));
    color:rgba(255,255,255,.88);
    font-size:9.5px;
    letter-spacing:.03em;
    line-height:1.35;
    font-family:'Jost',sans-serif;
    opacity:0;
    transition:opacity .6s ease;
    pointer-events:none;
  }
  .canvas-slot .credit.show{ opacity:1; }

  .canvas-slot .loader{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:4;
    color:rgba(255,255,255,.35);
    font-size:10px;
    letter-spacing:.25em;
    text-transform:uppercase;
    font-family:'Jost',sans-serif;
    transition:opacity .5s ease;
  }
  .canvas-slot .loader.hide{ opacity:0; pointer-events:none; }

  .caption-row{
    margin-top:22px;
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:14px;
    color:var(--muted);
    text-align:center;
  }
  .dot{
    width:4px; height:4px; border-radius:50%;
    background:var(--gold);
    display:inline-block;
  }

  .easylandx-btn{
    margin-top:38px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 30px;
    background:var(--ink);
    color:var(--paper);
    text-decoration:none;
    font-family:'Jost',sans-serif;
    font-size:13px;
    letter-spacing:.2em;
    text-transform:uppercase;
    border-radius:2px;
    transition:transform .25s ease, background .25s ease, box-shadow .25s ease;
    box-shadow: 0 10px 24px -12px rgba(0,0,0,.4);
  }
  .easylandx-btn:hover{
    background:var(--gold);
    color:var(--ink);
    transform:translateY(-2px);
    box-shadow: 0 16px 30px -14px rgba(184,147,95,.6);
  }
  .easylandx-btn svg{ width:14px; height:14px; }

  footer{
    margin-top:16px;
    font-size:10px;
    color:var(--muted);
    letter-spacing:.08em;
  }
</style>
</head>
<body>

  <div class="eyebrow">A Quiet Visit</div>

<script>
(function(){
  const AIC_SEARCH = "https://api.artic.edu/api/v1/artworks/search";
  const IIIF_BASE = "https://www.artic.edu/iiif/2/";
  const imgA = document.getElementById('artImgA');
  const imgB = document.getElementById('artImgB');
  const credit = document.getElementById('credit');
  const loader = document.getElementById('loader');
  let showingA = true;
  let pool = [];
  let usedIndexes = new Set();

  async function fetchPool(){
    try{
      const params = new URLSearchParams({
        q: "painting",
        query: JSON.stringify({
          bool: {
            must: [
              { exists: { field: "image_id" } },
              { term: { is_public_domain: true } }
            ]
          }
        }),
        fields: "id,title,artist_display,image_id,date_display",
        limit: "100"
      });
      const res = await fetch(AIC_SEARCH + "?" + params.toString());
      const data = await res.json();
      pool = (data.data || []).filter(a => a.image_id);
    }catch(e){
      pool = [];
    }
  }

  function randomArtwork(){
    if(pool.length === 0) return null;
    if(usedIndexes.size >= pool.length) usedIndexes.clear();
    let idx;
    do { idx = Math.floor(Math.random() * pool.length); } while(usedIndexes.has(idx) && usedIndexes.size < pool.length);
    usedIndexes.add(idx);
    return pool[idx];
  }

  function preload(url){
    return new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(url);
      im.onerror = reject;
      im.src = url;
    });
  }

  async function showNext(){
    const art = randomArtwork();
    if(!art) return;
    const url = IIIF_BASE + art.image_id + "/full/843,/0/default.jpg";
    try{
      await preload(url);
    }catch(e){
      return; // skip broken image, keep current one showing
    }

    const incoming = showingA ? imgB : imgA;
    const outgoing = showingA ? imgA : imgB;
    incoming.src = url;
    incoming.alt = art.title || "Artwork";
    incoming.classList.add('active');
    outgoing.classList.remove('active');
    showingA = !showingA;

    const label = [art.title, art.artist_display].filter(Boolean).join(" — ");
    credit.textContent = label;
    credit.classList.add('show');

    loader.classList.add('hide');
  }

  async function init(){
    await fetchPool();
    if(pool.length === 0){
      loader.textContent = "Gallery unavailable";
      return;
    }
    await showNext();
    setInterval(showNext, 8000);
  }

  init();
})();
</script>
