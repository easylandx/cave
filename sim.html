<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🕹️ EasySimulators</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #e0f2fe, #bae6fd);
            color: #1e2937;
            min-height: 100vh;
            padding: 20px 15px;
            line-height: 1.5;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.2em;
            margin-bottom: 8px;
            color: #0f172a;
        }

        p.subtitle {
            font-size: 1.1em;
            color: #334155;
            margin-bottom: 40px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin-bottom: 16px;
        }

        a {
            display: flex;
            align-items: center;
            padding: 22px 20px;
            background: white;
            color: #1e2937;
            text-decoration: none;
            font-size: 1.35em;
            font-weight: 600;
            border-radius: 16px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            gap: 16px;
        }

        a:active {
            transform: scale(0.96);
            background: #0ea5e9;
            color: white;
        }

        .emoji {
            font-size: 2em;
            width: 50px;
        }

        .title {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 EasyLand</h1>
        <p class="subtitle">Interactive Simulators</p>
        
        <ul>
            <li><a href="baby.html" target="_blank" rel="https://easylandx.github.io/cave/baby.html">
                <span class="emoji">👶</span>
                <span class="title">Baby Simulator</span>
            </a></li>
            
            <li><a href="cat.html" target="_blank" rel="https://easylandx.github.io/cave/cat.html">
                <span class="emoji">🐱</span>
                <span class="title">Cat Simulator</span>
            </a></li>
            
            <li><a href="man.html" target="_blank" rel="https://easylandx.github.io/cave/nean.html">
                <span class="emoji">🔥</span>
                <span class="title">Neanderthal Simulator</span>
            </a></li>
            
            <li><a href="hom.html" target="_blank" rel="https://easylandx.github.io/cave/hom.html">
                <span class="emoji">🧔</span>
                <span class="title">Homo Sapiens Simulator</span>
            </a></li>
                        
            <li><a href="nean.html" target="_blank" rel="https://easylandx.github.io/cave/hom.html">
                <span class="emoji">🧍‍♂️</span>
                <span class="title">Man Simulator</span>
            </a></li>
        </ul>

        <p style="margin-top: 50px; color: #64748b; font-size: 0.95em;">
            Scroll & tap to explore
        </p>
    </div>
</body>
</html>
